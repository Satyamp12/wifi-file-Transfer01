name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check keystore
        run: |
          if [ -f "keystore/debug.keystore" ]; then
            echo "Keystore found! Size: $(wc -c < keystore/debug.keystore) bytes"
          else
            echo "Keystore not found - creating new one"
            mkdir -p keystore
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore keystore/debug.keystore \
              -storepass android \
              -dname "CN=WiFiTransfer,O=WiFiTransfer,C=IN" \
              -keyalg RSA -keysize 2048 -validity 36500
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WiFiFileTransfer-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
